<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#080922">
    <title>Neon Fighters</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #080922;
        color: #fff;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        overflow: hidden;
      }

      .arena {
        position: relative;
        display: flex;
        min-height: 100svh;
        align-items: flex-end;
        justify-content: space-between;
        overflow: hidden;
        isolation: isolate;
        padding: 8rem clamp(1.5rem, 8vw, 9rem) 8vh;
        background: #090b2d url("Arena%20Neon%20Sobre%20a%20Cidade%20Cyberpunk.png") center bottom / cover no-repeat;
      }

      .arena::before {
        position: absolute;
        z-index: 0;
        background:
          linear-gradient(180deg, rgb(5 7 34 / 22%), transparent 38%, rgb(8 8 33 / 8%) 62%, rgb(5 6 24 / 38%)),
          linear-gradient(90deg, rgb(10 9 37 / 12%), transparent 50%, rgb(10 9 37 / 12%));
        content: "";
        inset: 0;
        pointer-events: none;
      }

      .fighter {
        --shirt: #1598ff;
        --shirt-light: #71eaff;
        --skin: #f2b48c;
        --pants: #17203e;
        position: relative;
        z-index: 1;
        width: clamp(90px, 12vw, 160px);
        height: clamp(300px, 48vh, 430px);
        flex: 0 0 auto;
        filter: drop-shadow(0 0.75rem 0.45rem rgb(3 5 22 / 65%));
        transform-origin: center bottom;
        animation: idle 2.4s ease-in-out infinite;
      }

      .fighter--blue {
        margin-left: 3vw;
        transform: translateX(var(--player-x, 0px));
      }

      .fighter--red {
        --shirt: #ed315f;
        --shirt-light: #ff9e83;
        --pants: #31182d;
        margin-right: 3vw;
        transform: scaleX(-1);
        animation-delay: -1.2s;
      }

      .fighter__head {
        position: absolute;
        top: 3%;
        left: 35%;
        width: 30%;
        height: 21%;
        border: 2px solid rgb(53 28 38 / 35%);
        border-radius: 43% 45% 40% 42%;
        background: linear-gradient(110deg, #ffd4ac, var(--skin) 68%, #c78370);
      }

      .fighter__hair {
        position: absolute;
        top: 1%;
        left: 32%;
        width: 35%;
        height: 11%;
        border-radius: 65% 45% 30% 20%;
        background: linear-gradient(120deg, #20213d, #080b1b);
        clip-path: polygon(0 45%, 20% 8%, 44% 20%, 66% 0, 100% 30%, 87% 100%, 72% 71%, 43% 85%, 18% 68%);
      }

      .fighter__headband {
        position: absolute;
        z-index: 1;
        top: 8%;
        left: 33%;
        width: 34%;
        height: 3.5%;
        border-radius: 50%;
        background: linear-gradient(90deg, var(--shirt), var(--shirt-light), var(--shirt));
        box-shadow: 0 2px 4px rgb(0 0 0 / 40%);
        transform: rotate(-7deg);
      }

      .fighter__face {
        position: absolute;
        top: 12%;
        left: 55%;
        width: 8%;
        height: 2%;
        border-radius: 50%;
        background: #211a2d;
        box-shadow: 0 0.42rem 0 -1px #a75454;
      }

      .fighter__brow {
        position: absolute;
        top: 10.5%;
        left: 54%;
        width: 10%;
        height: 1.2%;
        border-radius: 100%;
        background: #30202c;
        transform: rotate(-8deg);
      }

      .fighter__neck {
        position: absolute;
        top: 21%;
        left: 44%;
        width: 12%;
        height: 8%;
        background: linear-gradient(90deg, #c78370, #ffd4ac 52%, #c78370);
      }

      .fighter__torso {
        position: absolute;
        top: 25%;
        left: 29%;
        width: 48%;
        height: 36%;
        border: 2px solid rgb(7 12 38 / 70%);
        border-radius: 30% 30% 17% 17%;
        background: linear-gradient(105deg, var(--shirt) 0 25%, var(--shirt-light) 48%, var(--shirt) 75%);
        clip-path: polygon(20% 0, 80% 0, 100% 14%, 88% 100%, 12% 100%, 0 14%);
      }

      .fighter__torso::after {
        position: absolute;
        top: 12%;
        left: 49%;
        width: 3px;
        height: 80%;
        background: rgb(255 255 255 / 36%);
        content: "";
      }

      .fighter__emblem {
        position: absolute;
        z-index: 1;
        top: 34%;
        left: 45%;
        width: 12%;
        aspect-ratio: 1;
        border: 2px solid rgb(255 255 255 / 80%);
        border-radius: 50%;
        background: linear-gradient(145deg, var(--shirt-light), var(--shirt));
        box-shadow: 0 0 0 2px rgb(4 16 48 / 35%), 0 0 0.65rem var(--shirt-light);
      }

      .fighter__emblem::after {
        position: absolute;
        top: 18%;
        left: 38%;
        width: 25%;
        height: 58%;
        background: #fff;
        clip-path: polygon(45% 0, 100% 0, 54% 42%, 91% 42%, 0 100%, 35% 53%, 0 53%);
        content: "";
      }

      .fighter__arm {
        position: absolute;
        top: 29%;
        width: 14%;
        height: 35%;
        border: 2px solid rgb(18 21 46 / 78%);
        border-radius: 45% 45% 38% 38%;
        background: linear-gradient(90deg, var(--shirt), var(--shirt-light));
      }

      .fighter__arm--left {
        left: 19%;
        transform: rotate(19deg);
      }

      .fighter__arm--right {
        right: 16%;
        transform: rotate(-27deg);
      }

      .fighter__glove {
        position: absolute;
        top: 53%;
        width: 18%;
        height: 12%;
        border: 2px solid #15152d;
        border-radius: 42% 42% 50% 50%;
        background: linear-gradient(130deg, #fff0d4, #c99077);
      }

      .fighter__glove--left {
        left: 15%;
        transform: rotate(-15deg);
      }

      .fighter__glove--right {
        right: 12%;
        transform: rotate(16deg);
      }

      .fighter__wristband {
        position: absolute;
        z-index: 1;
        top: 51%;
        width: 18%;
        height: 3.5%;
        border: 1px solid rgb(255 255 255 / 80%);
        border-radius: 40%;
        background: var(--shirt-light);
        box-shadow: 0 0 0.4rem var(--shirt-light);
      }

      .fighter__wristband--left {
        left: 15%;
        transform: rotate(-15deg);
      }

      .fighter__wristband--right {
        right: 12%;
        transform: rotate(16deg);
      }

      .fighter__belt {
        position: absolute;
        z-index: 1;
        top: 55%;
        left: 29%;
        width: 48%;
        height: 5%;
        border: 2px solid #d5b45c;
        background: #20223a;
      }

      .fighter__leg {
        position: absolute;
        top: 59%;
        width: 19%;
        height: 32%;
        border: 2px solid rgb(8 12 30 / 78%);
        border-radius: 12% 12% 28% 30%;
        background: linear-gradient(90deg, var(--pants), #39405f 55%, var(--pants));
      }

      .fighter__leg--left {
        left: 33%;
        transform: rotate(5deg);
      }

      .fighter__leg--right {
        right: 27%;
        transform: rotate(-6deg);
      }

      .fighter__shoe {
        position: absolute;
        top: 87%;
        width: 29%;
        height: 10%;
        border: 2px solid #090b1b;
        border-radius: 50% 30% 22% 25%;
        background: linear-gradient(#f5f4ed 0 55%, #ff427d 57%);
      }

      .fighter__shoe--left {
        left: 22%;
        transform: rotate(-5deg);
      }

      .fighter__shoe--right {
        right: 20%;
        transform: scaleX(-1) rotate(-5deg);
      }

      @keyframes idle {
        0%, 100% {
          translate: 0 0;
        }
        50% {
          translate: 0 -0.55rem;
        }
      }

      @keyframes jump {
        0%, 100% {
          translate: 0 0;
        }
        42% {
          translate: 0 -10rem;
        }
      }

      @keyframes walk-bounce {
        0%, 100% {
          translate: 0 0;
        }
        50% {
          translate: 0 -0.35rem;
        }
      }

      @keyframes walk-arm {
        0%, 100% {
          transform: rotate(19deg);
        }
        50% {
          transform: rotate(-8deg);
        }
      }

      @keyframes walk-arm-back {
        0%, 100% {
          transform: rotate(-27deg);
        }
        50% {
          transform: rotate(-43deg);
        }
      }

      .fighter--blue.is-walking {
        animation: walk-bounce 320ms ease-in-out infinite;
      }

      .fighter--blue.is-walking .fighter__arm--left {
        animation: walk-arm 320ms ease-in-out infinite;
      }

      .fighter--blue.is-walking .fighter__arm--right {
        animation: walk-arm-back 320ms ease-in-out infinite;
      }

      .fighter--blue.is-walking-back .fighter__arm--left {
        animation: walk-arm-back 320ms ease-in-out infinite;
      }

      .fighter--blue.is-walking-back .fighter__arm--right {
        animation: walk-arm 320ms ease-in-out infinite;
      }

      .fighter--blue.is-jumping {
        animation: jump 580ms cubic-bezier(0.22, 0.75, 0.35, 1) both;
      }

      @media (max-width: 600px) {
        .arena {
          min-height: 100svh;
          padding: 8rem 0.5rem 12vh;
          background-position: center;
        }

        .fighter {
          width: clamp(82px, 25vw, 125px);
          height: clamp(270px, 42vh, 340px);
        }

        .fighter--blue {
          margin-left: 0;
        }

        .fighter--red {
          margin-right: 0;
        }

      }

      .fighter {
        width: clamp(48px, 6vw, 72px);
        height: clamp(76px, 14vh, 112px);
        border: 3px solid rgb(255 255 255 / 55%);
        border-radius: 3px;
        background: #1688ff;
        box-shadow: inset 7px 0 rgb(255 255 255 / 18%), 0 8px 12px rgb(0 0 0 / 38%);
        filter: none;
        animation: none;
        transform: translateX(var(--player-x, 0px));
      }

      .fighter--blue {
        background: #1688ff;
      }

      .fighter--red {
        background: #ed315f;
      }

      .fighter.is-walking {
        animation: walk-bounce 320ms ease-in-out infinite;
      }

      .fighter.is-jumping {
        animation: block-jump 580ms cubic-bezier(0.22, 0.75, 0.35, 1) both;
      }

      @keyframes block-jump {
        0%, 100% {
          translate: 0 0;
        }
        42% {
          translate: 0 -12rem;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          scroll-behavior: auto !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="arena" aria-label="Arena de luta neon">
      <div class="fighter fighter--blue" role="img" aria-label="Lutador com camisa azul">
      </div>

      <div class="fighter fighter--red" role="img" aria-label="Lutador com camisa vermelha">
      </div>

    </main>
    <script>
      const arena = document.querySelector(".arena");
      const blueFighter = document.querySelector(".fighter--blue");
      const redFighter = document.querySelector(".fighter--red");
      const heldKeys = new Set();
      const redHeldKeys = new Set();
      const movementSpeed = 280;
      let horizontalOffset = 0;
      let redHorizontalOffset = 0;
      let animationFrame = null;
      let redAnimationFrame = null;
      let previousFrameTime = 0;
      let redPreviousFrameTime = 0;

      function getMovementBounds(fighter, otherFighter, currentOffset, direction) {
        const arenaRect = arena.getBoundingClientRect();
        const fighterRect = fighter.getBoundingClientRect();
        const otherRect = otherFighter.getBoundingClientRect();
        const baseLeft = fighterRect.left - currentOffset;
        const minOffset = arenaRect.left + 16 - baseLeft;
        const maxOffset = arenaRect.right - 16 - (baseLeft + fighterRect.width);
        const verticalOverlap = fighterRect.bottom > otherRect.top && fighterRect.top < otherRect.bottom;
        let min = minOffset;
        let max = maxOffset;

        if (verticalOverlap && direction > 0 && fighterRect.left < otherRect.left) {
          max = Math.min(max, otherRect.left - 24 - (baseLeft + fighterRect.width));
        } else if (verticalOverlap && direction < 0 && fighterRect.left > otherRect.left) {
          min = Math.max(min, otherRect.right + 24 - baseLeft);
        }

        return { min, max };
      }

      function moveFighter(time) {
        const direction = Number(heldKeys.has("d")) - Number(heldKeys.has("a"));
        if (direction === 0) {
          animationFrame = null;
          return;
        }

        const elapsed = previousFrameTime ? Math.min((time - previousFrameTime) / 1000, 0.05) : 0;
        previousFrameTime = time;
        const bounds = getMovementBounds(blueFighter, redFighter, horizontalOffset, direction);
        horizontalOffset = Math.max(
          bounds.min,
          Math.min(bounds.max, horizontalOffset + direction * movementSpeed * elapsed),
        );
        blueFighter.style.setProperty("--player-x", `${horizontalOffset}px`);
        animationFrame = requestAnimationFrame(moveFighter);
      }

      function moveRedFighter(time) {
        if (!redHeldKeys.has("ArrowLeft")) {
          redAnimationFrame = null;
          return;
        }

        const elapsed = redPreviousFrameTime ? Math.min((time - redPreviousFrameTime) / 1000, 0.05) : 0;
        redPreviousFrameTime = time;
        const bounds = getMovementBounds(redFighter, blueFighter, redHorizontalOffset, -1);
        redHorizontalOffset = Math.max(
          bounds.min,
          Math.min(0, bounds.max, redHorizontalOffset - movementSpeed * elapsed),
        );
        redFighter.style.setProperty("--player-x", `${redHorizontalOffset}px`);
        redAnimationFrame = requestAnimationFrame(moveRedFighter);
      }

      function startJump(fighter) {
        if (fighter.classList.contains("is-jumping")) return;
        fighter.classList.add("is-jumping");
        window.clearTimeout(fighter.jumpTimeout);
        fighter.jumpTimeout = window.setTimeout(() => {
          fighter.classList.remove("is-jumping");
        }, 600);
      }

      document.addEventListener("keydown", (event) => {
        const key = event.key.toLowerCase();
        if (key !== "d" && key !== "a" && key !== "w" && key !== "arrowleft" && key !== "arrowup") return;

        event.preventDefault();
        if (key === "w") {
          if (!event.repeat) startJump(blueFighter);
          return;
        }

        if (key === "arrowup") {
          if (!event.repeat) startJump(redFighter);
          return;
        }

        if (key === "arrowleft") {
          redHeldKeys.add("ArrowLeft");
          redFighter.classList.add("is-walking");
          if (redAnimationFrame === null) {
            redPreviousFrameTime = 0;
            redAnimationFrame = requestAnimationFrame(moveRedFighter);
          }
        } else {
          heldKeys.add(key);
          blueFighter.classList.toggle("is-walking", heldKeys.has("d") || heldKeys.has("a"));
          blueFighter.classList.toggle("is-walking-back", heldKeys.has("a"));
          if (animationFrame === null) {
            previousFrameTime = 0;
            animationFrame = requestAnimationFrame(moveFighter);
          }
        }
      });

      document.addEventListener("keyup", (event) => {
        const key = event.key.toLowerCase();
        if (key === "arrowleft") {
          redHeldKeys.delete("ArrowLeft");
          redFighter.classList.remove("is-walking");
        } else if (key === "d" || key === "a") {
          heldKeys.delete(key);
          blueFighter.classList.toggle("is-walking", heldKeys.has("d") || heldKeys.has("a"));
          blueFighter.classList.toggle("is-walking-back", heldKeys.has("a"));
        }
      });

      window.addEventListener("blur", () => {
        heldKeys.clear();
        redHeldKeys.clear();
        blueFighter.classList.remove("is-walking", "is-walking-back");
        redFighter.classList.remove("is-walking");
        if (animationFrame !== null) {
          cancelAnimationFrame(animationFrame);
          animationFrame = null;
        }
        if (redAnimationFrame !== null) {
          cancelAnimationFrame(redAnimationFrame);
          redAnimationFrame = null;
        }
      });

      window.addEventListener("resize", () => {
        const bounds = getMovementBounds(blueFighter, redFighter, horizontalOffset, 0);
        horizontalOffset = Math.max(bounds.min, Math.min(bounds.max, horizontalOffset));
        blueFighter.style.setProperty("--player-x", `${horizontalOffset}px`);
        const redBounds = getMovementBounds(redFighter, blueFighter, redHorizontalOffset, 0);
        redHorizontalOffset = Math.max(redBounds.min, Math.min(redBounds.max, redHorizontalOffset));
        redFighter.style.setProperty("--player-x", `${redHorizontalOffset}px`);
      });
    </script>
  </body>
</html>
