<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#080922">
    <title>Neon Fighters</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #080922;
        color: #fff;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        overflow: hidden;
      }

      .arena {
        position: relative;
        display: flex;
        min-height: 100svh;
        align-items: flex-end;
        justify-content: space-between;
        overflow: hidden;
        isolation: isolate;
        padding: 8rem clamp(1.5rem, 8vw, 9rem) 8vh;
        background: #090b2d url("Arena%20Neon%20Sobre%20a%20Cidade%20Cyberpunk.png") center bottom / cover no-repeat;
      }

      .arena::before {
        position: absolute;
        z-index: 0;
        background:
          linear-gradient(180deg, rgb(5 7 34 / 22%), transparent 38%, rgb(8 8 33 / 8%) 62%, rgb(5 6 24 / 38%)),
          linear-gradient(90deg, rgb(10 9 37 / 12%), transparent 50%, rgb(10 9 37 / 12%));
        content: "";
        inset: 0;
        pointer-events: none;
      }

      .hud {
        position: absolute;
        z-index: 3;
        top: clamp(1.25rem, 4vh, 3rem);
        right: clamp(1rem, 5vw, 5rem);
        left: clamp(1rem, 5vw, 5rem);
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: start;
        gap: 1rem;
      }

      .player-card {
        width: min(100%, 23rem);
        padding: 0.8rem 1rem;
        border: 1px solid rgb(255 255 255 / 28%);
        background: rgb(8 9 35 / 72%);
        box-shadow: 0 0 1.5rem rgb(9 12 48 / 45%);
        backdrop-filter: blur(8px);
      }

      .player-card--blue {
        justify-self: start;
        border-left: 3px solid #25c7ff;
      }

      .player-card--red {
        justify-self: end;
        border-right: 3px solid #ff397c;
        text-align: right;
      }

      .player-name {
        display: block;
        font-size: clamp(0.7rem, 1.5vw, 0.95rem);
        font-weight: 800;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      .player-card--blue .player-name {
        color: #69ddff;
      }

      .player-card--red .player-name {
        color: #ff779e;
      }

      .health {
        height: 0.45rem;
        margin-top: 0.65rem;
        overflow: hidden;
        background: rgb(255 255 255 / 16%);
      }

      .health::after {
        display: block;
        width: 92%;
        height: 100%;
        background: linear-gradient(90deg, #167dff, #54edff);
        content: "";
      }

      .player-card--red .health::after {
        margin-left: auto;
        background: linear-gradient(90deg, #ffb13b, #ff397c);
      }

      .round-label {
        padding-top: 0.8rem;
        color: #fff;
        font-size: 0.75rem;
        font-weight: 800;
        letter-spacing: 0.2em;
        text-shadow: 0 0 1rem #d14cff;
        text-transform: uppercase;
      }

      .fighter {
        --shirt: #1598ff;
        --shirt-light: #71eaff;
        --skin: #f2b48c;
        --pants: #17203e;
        position: relative;
        z-index: 1;
        width: clamp(90px, 12vw, 160px);
        height: clamp(300px, 48vh, 430px);
        flex: 0 0 auto;
        filter: drop-shadow(0 0.75rem 0.45rem rgb(3 5 22 / 65%));
        transform-origin: center bottom;
        animation: idle 2.4s ease-in-out infinite;
      }

      .fighter--blue {
        margin-left: 3vw;
        transform: translateX(var(--player-x, 0px));
      }

      .fighter--red {
        --shirt: #ed315f;
        --shirt-light: #ff9e83;
        --pants: #31182d;
        margin-right: 3vw;
        transform: scaleX(-1);
        animation-delay: -1.2s;
      }

      .fighter__head {
        position: absolute;
        top: 3%;
        left: 35%;
        width: 30%;
        height: 21%;
        border: 2px solid rgb(53 28 38 / 35%);
        border-radius: 43% 45% 40% 42%;
        background: linear-gradient(110deg, #ffd4ac, var(--skin) 68%, #c78370);
      }

      .fighter__hair {
        position: absolute;
        top: 1%;
        left: 32%;
        width: 35%;
        height: 11%;
        border-radius: 65% 45% 30% 20%;
        background: linear-gradient(120deg, #20213d, #080b1b);
        clip-path: polygon(0 45%, 20% 8%, 44% 20%, 66% 0, 100% 30%, 87% 100%, 72% 71%, 43% 85%, 18% 68%);
      }

      .fighter__headband {
        position: absolute;
        z-index: 1;
        top: 8%;
        left: 33%;
        width: 34%;
        height: 3.5%;
        border-radius: 50%;
        background: linear-gradient(90deg, var(--shirt), var(--shirt-light), var(--shirt));
        box-shadow: 0 2px 4px rgb(0 0 0 / 40%);
        transform: rotate(-7deg);
      }

      .fighter__face {
        position: absolute;
        top: 12%;
        left: 55%;
        width: 8%;
        height: 2%;
        border-radius: 50%;
        background: #211a2d;
        box-shadow: 0 0.42rem 0 -1px #a75454;
      }

      .fighter__brow {
        position: absolute;
        top: 10.5%;
        left: 54%;
        width: 10%;
        height: 1.2%;
        border-radius: 100%;
        background: #30202c;
        transform: rotate(-8deg);
      }

      .fighter__neck {
        position: absolute;
        top: 21%;
        left: 44%;
        width: 12%;
        height: 8%;
        background: linear-gradient(90deg, #c78370, #ffd4ac 52%, #c78370);
      }

      .fighter__torso {
        position: absolute;
        top: 25%;
        left: 29%;
        width: 48%;
        height: 36%;
        border: 2px solid rgb(7 12 38 / 70%);
        border-radius: 30% 30% 17% 17%;
        background: linear-gradient(105deg, var(--shirt) 0 25%, var(--shirt-light) 48%, var(--shirt) 75%);
        clip-path: polygon(20% 0, 80% 0, 100% 14%, 88% 100%, 12% 100%, 0 14%);
      }

      .fighter__torso::after {
        position: absolute;
        top: 12%;
        left: 49%;
        width: 3px;
        height: 80%;
        background: rgb(255 255 255 / 36%);
        content: "";
      }

      .fighter__emblem {
        position: absolute;
        z-index: 1;
        top: 34%;
        left: 45%;
        width: 12%;
        aspect-ratio: 1;
        border: 2px solid rgb(255 255 255 / 80%);
        border-radius: 50%;
        background: linear-gradient(145deg, var(--shirt-light), var(--shirt));
        box-shadow: 0 0 0 2px rgb(4 16 48 / 35%), 0 0 0.65rem var(--shirt-light);
      }

      .fighter__emblem::after {
        position: absolute;
        top: 18%;
        left: 38%;
        width: 25%;
        height: 58%;
        background: #fff;
        clip-path: polygon(45% 0, 100% 0, 54% 42%, 91% 42%, 0 100%, 35% 53%, 0 53%);
        content: "";
      }

      .fighter__arm {
        position: absolute;
        top: 29%;
        width: 14%;
        height: 35%;
        border: 2px solid rgb(18 21 46 / 78%);
        border-radius: 45% 45% 38% 38%;
        background: linear-gradient(90deg, var(--shirt), var(--shirt-light));
      }

      .fighter__arm--left {
        left: 19%;
        transform: rotate(19deg);
      }

      .fighter__arm--right {
        right: 16%;
        transform: rotate(-27deg);
      }

      .fighter__glove {
        position: absolute;
        top: 53%;
        width: 18%;
        height: 12%;
        border: 2px solid #15152d;
        border-radius: 42% 42% 50% 50%;
        background: linear-gradient(130deg, #fff0d4, #c99077);
      }

      .fighter__glove--left {
        left: 15%;
        transform: rotate(-15deg);
      }

      .fighter__glove--right {
        right: 12%;
        transform: rotate(16deg);
      }

      .fighter__wristband {
        position: absolute;
        z-index: 1;
        top: 51%;
        width: 18%;
        height: 3.5%;
        border: 1px solid rgb(255 255 255 / 80%);
        border-radius: 40%;
        background: var(--shirt-light);
        box-shadow: 0 0 0.4rem var(--shirt-light);
      }

      .fighter__wristband--left {
        left: 15%;
        transform: rotate(-15deg);
      }

      .fighter__wristband--right {
        right: 12%;
        transform: rotate(16deg);
      }

      .fighter__belt {
        position: absolute;
        z-index: 1;
        top: 55%;
        left: 29%;
        width: 48%;
        height: 5%;
        border: 2px solid #d5b45c;
        background: #20223a;
      }

      .fighter__leg {
        position: absolute;
        top: 59%;
        width: 19%;
        height: 32%;
        border: 2px solid rgb(8 12 30 / 78%);
        border-radius: 12% 12% 28% 30%;
        background: linear-gradient(90deg, var(--pants), #39405f 55%, var(--pants));
      }

      .fighter__leg--left {
        left: 33%;
        transform: rotate(5deg);
      }

      .fighter__leg--right {
        right: 27%;
        transform: rotate(-6deg);
      }

      .fighter__shoe {
        position: absolute;
        top: 87%;
        width: 29%;
        height: 10%;
        border: 2px solid #090b1b;
        border-radius: 50% 30% 22% 25%;
        background: linear-gradient(#f5f4ed 0 55%, #ff427d 57%);
      }

      .fighter__shoe--left {
        left: 22%;
        transform: rotate(-5deg);
      }

      .fighter__shoe--right {
        right: 20%;
        transform: scaleX(-1) rotate(-5deg);
      }

      .versus {
        position: absolute;
        z-index: 1;
        bottom: 34%;
        left: 50%;
        color: rgb(255 255 255 / 82%);
        font-size: clamp(1.5rem, 4vw, 3.5rem);
        font-style: italic;
        font-weight: 1000;
        text-shadow: 0 0 1.4rem #fc39df, 0 0 2.5rem #477bff;
        transform: translateX(-50%);
      }

      .arena-caption {
        position: absolute;
        z-index: 2;
        right: 1rem;
        bottom: 0.75rem;
        left: 1rem;
        color: rgb(255 255 255 / 62%);
        font-size: 0.65rem;
        letter-spacing: 0.16em;
        text-align: center;
        text-shadow: 0 1px 5px #050617;
        text-transform: uppercase;
      }

      @keyframes idle {
        0%, 100% {
          translate: 0 0;
        }
        50% {
          translate: 0 -0.55rem;
        }
      }

      @keyframes jump {
        0%, 100% {
          translate: 0 0;
        }
        42% {
          translate: 0 -10rem;
        }
      }

      @keyframes walk-bounce {
        0%, 100% {
          translate: 0 0;
        }
        50% {
          translate: 0 -0.35rem;
        }
      }

      @keyframes walk-arm {
        0%, 100% {
          transform: rotate(19deg);
        }
        50% {
          transform: rotate(-8deg);
        }
      }

      @keyframes walk-arm-back {
        0%, 100% {
          transform: rotate(-27deg);
        }
        50% {
          transform: rotate(-43deg);
        }
      }

      .fighter--blue.is-walking {
        animation: walk-bounce 320ms ease-in-out infinite;
      }

      .fighter--blue.is-walking .fighter__arm--left {
        animation: walk-arm 320ms ease-in-out infinite;
      }

      .fighter--blue.is-walking .fighter__arm--right {
        animation: walk-arm-back 320ms ease-in-out infinite;
      }

      .fighter--blue.is-walking-back .fighter__arm--left {
        animation: walk-arm-back 320ms ease-in-out infinite;
      }

      .fighter--blue.is-walking-back .fighter__arm--right {
        animation: walk-arm 320ms ease-in-out infinite;
      }

      .fighter--blue.is-jumping {
        animation: jump 580ms cubic-bezier(0.22, 0.75, 0.35, 1) both;
      }

      @media (max-width: 600px) {
        .arena {
          min-height: 100svh;
          padding: 8rem 0.5rem 12vh;
          background-position: center;
        }

        .hud {
          right: 0.75rem;
          left: 0.75rem;
          gap: 0.5rem;
        }

        .player-card {
          padding: 0.65rem;
        }

        .round-label {
          padding-top: 0.65rem;
          font-size: 0.6rem;
        }

        .fighter {
          width: clamp(82px, 25vw, 125px);
          height: clamp(270px, 42vh, 340px);
        }

        .fighter--blue {
          margin-left: 0;
        }

        .fighter--red {
          margin-right: 0;
        }

        .versus {
          bottom: 34%;
        }

      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          scroll-behavior: auto !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="arena" aria-label="Arena de luta neon">
      <header class="hud" aria-label="Placar">
        <div class="player-card player-card--blue">
          <span class="player-name">Jogador 1</span>
          <div class="health" aria-label="Vida: 92%"></div>
        </div>
        <span class="round-label">Round 01</span>
        <div class="player-card player-card--red">
          <span class="player-name">Jogador 2</span>
          <div class="health" aria-label="Vida: 92%"></div>
        </div>
      </header>

      <div class="fighter fighter--blue" role="img" aria-label="Lutador com camisa azul">
        <span class="fighter__hair"></span>
        <span class="fighter__headband"></span>
        <span class="fighter__head"></span>
        <span class="fighter__face"></span>
        <span class="fighter__brow"></span>
        <span class="fighter__neck"></span>
        <span class="fighter__arm fighter__arm--left"></span>
        <span class="fighter__arm fighter__arm--right"></span>
        <span class="fighter__torso"></span>
        <span class="fighter__emblem"></span>
        <span class="fighter__wristband fighter__wristband--left"></span>
        <span class="fighter__wristband fighter__wristband--right"></span>
        <span class="fighter__glove fighter__glove--left"></span>
        <span class="fighter__glove fighter__glove--right"></span>
        <span class="fighter__belt"></span>
        <span class="fighter__leg fighter__leg--left"></span>
        <span class="fighter__leg fighter__leg--right"></span>
        <span class="fighter__shoe fighter__shoe--left"></span>
        <span class="fighter__shoe fighter__shoe--right"></span>
      </div>

      <span class="versus" aria-hidden="true">VS</span>

      <div class="fighter fighter--red" role="img" aria-label="Lutador com camisa vermelha">
        <span class="fighter__hair"></span>
        <span class="fighter__headband"></span>
        <span class="fighter__head"></span>
        <span class="fighter__face"></span>
        <span class="fighter__brow"></span>
        <span class="fighter__neck"></span>
        <span class="fighter__arm fighter__arm--left"></span>
        <span class="fighter__arm fighter__arm--right"></span>
        <span class="fighter__torso"></span>
        <span class="fighter__emblem"></span>
        <span class="fighter__wristband fighter__wristband--left"></span>
        <span class="fighter__wristband fighter__wristband--right"></span>
        <span class="fighter__glove fighter__glove--left"></span>
        <span class="fighter__glove fighter__glove--right"></span>
        <span class="fighter__belt"></span>
        <span class="fighter__leg fighter__leg--left"></span>
        <span class="fighter__leg fighter__leg--right"></span>
        <span class="fighter__shoe fighter__shoe--left"></span>
        <span class="fighter__shoe fighter__shoe--right"></span>
      </div>

      <p class="arena-caption">Neon City · Arena de combate</p>
    </main>
    <script>
      const arena = document.querySelector(".arena");
      const blueFighter = document.querySelector(".fighter--blue");
      const redFighter = document.querySelector(".fighter--red");
      const heldKeys = new Set();
      const movementSpeed = 280;
      let horizontalOffset = 0;
      let animationFrame = null;
      let previousFrameTime = 0;
      let jumpTimeout = null;

      function getMovementBounds() {
        const arenaRect = arena.getBoundingClientRect();
        const blueRect = blueFighter.getBoundingClientRect();
        const redRect = redFighter.getBoundingClientRect();
        const baseLeft = blueRect.left - horizontalOffset;
        const minOffset = arenaRect.left + 16 - baseLeft;
        const maxOffset = Math.min(
          redRect.left - 24,
          arenaRect.right - 16,
        ) - (baseLeft + blueRect.width);
        return { min: Math.min(0, minOffset), max: Math.max(0, maxOffset) };
      }

      function moveFighter(time) {
        const direction = Number(heldKeys.has("d")) - Number(heldKeys.has("a"));
        if (direction === 0) {
          animationFrame = null;
          return;
        }

        const elapsed = previousFrameTime ? Math.min((time - previousFrameTime) / 1000, 0.05) : 0;
        previousFrameTime = time;
        const bounds = getMovementBounds();
        horizontalOffset = Math.max(
          bounds.min,
          Math.min(bounds.max, horizontalOffset + direction * movementSpeed * elapsed),
        );
        blueFighter.style.setProperty("--player-x", `${horizontalOffset}px`);
        animationFrame = requestAnimationFrame(moveFighter);
      }

      function startJump() {
        if (blueFighter.classList.contains("is-jumping")) return;
        blueFighter.classList.add("is-jumping");
        window.clearTimeout(jumpTimeout);
        jumpTimeout = window.setTimeout(() => {
          blueFighter.classList.remove("is-jumping");
        }, 600);
      }

      document.addEventListener("keydown", (event) => {
        const key = event.key.toLowerCase();
        if (key !== "d" && key !== "a" && key !== "w") return;

        event.preventDefault();
        if (key === "w") {
          if (!event.repeat) startJump();
          return;
        }

        heldKeys.add(key);
        blueFighter.classList.toggle("is-walking", key === "d");
        blueFighter.classList.toggle("is-walking-back", key === "a");
        if (animationFrame === null) {
          previousFrameTime = 0;
          animationFrame = requestAnimationFrame(moveFighter);
        }
      });

      document.addEventListener("keyup", (event) => {
        const key = event.key.toLowerCase();
        if (key === "d" || key === "a") {
          heldKeys.delete(key);
          blueFighter.classList.toggle("is-walking", heldKeys.has("d"));
          blueFighter.classList.toggle("is-walking-back", heldKeys.has("a"));
        }
      });

      window.addEventListener("blur", () => {
        heldKeys.clear();
        blueFighter.classList.remove("is-walking");
        blueFighter.classList.remove("is-walking-back");
        if (animationFrame !== null) {
          cancelAnimationFrame(animationFrame);
          animationFrame = null;
        }
      });

      window.addEventListener("resize", () => {
        const bounds = getMovementBounds();
        horizontalOffset = Math.max(bounds.min, Math.min(bounds.max, horizontalOffset));
        blueFighter.style.setProperty("--player-x", `${horizontalOffset}px`);
      });
    </script>
  </body>
</html>
